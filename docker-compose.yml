version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campus_lab_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Suraj@2005
      POSTGRES_DB: campus_lab_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_lab_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:Suraj@2005@db:5432/campus_lab_optimizer
      SECRET_KEY: campus_lab_optimizer_super_secret_jwt_key_2026_code_crack
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: admin@campuslab.edu
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_lab_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:

